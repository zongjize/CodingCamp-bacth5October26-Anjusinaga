<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List Life Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="dashboard-container">
    
    <!-- Top Header Card: Clock, Date, Greeting -->
    <header class="card header-card">
      <div id="clock" class="clock-display">00:00:00</div>
      <div id="date" class="date-display">Loading date...</div>
      <h1 id="greeting" class="greeting-text">Good Morning</h1>
      <div class="name-container">
        <input type="text" id="nameInput" placeholder="Enter your name..." />
        <button id="saveNameBtn">Save Name</button>
      </div>
    </header>

    <!-- Main Grid Layout -->
    <main class="dashboard-grid">
      
      <!-- Focus Timer Card -->
      <section class="card timer-card">
        <h2>Focus Timer</h2>
        <div id="timerDisplay" class="timer-display">25:00</div>
        <div class="timer-controls">
          <button id="startTimerBtn" class="btn btn-primary">Start</button>
          <button id="stopTimerBtn" class="btn btn-secondary">Stop</button>
          <button id="resetTimerBtn" class="btn btn-secondary">Reset</button>
        </div>
        <div class="custom-timer">
          <input type="number" id="customMinutes" placeholder="Mins" min="1" max="120" value="25">
          <button id="setTimerBtn" class="btn btn-small">Set Time</button>
        </div>
      </section>

      <!-- Tasks Card -->
      <section class="card tasks-card">
        <h2>Tasks</h2>
        <form id="taskForm" class="input-group">
          <input type="text" id="taskInput" placeholder="Add a new task..." required />
          <button type="submit" class="btn btn-primary">Add</button>
        </form>
        <p id="taskError" class="error-msg"></p>
        <ul id="taskList" class="task-list"></ul>
      </section>

      <!-- Quick Links Card -->
      <section class="card links-card">
        <h2>Quick Links</h2>
        <form id="linkForm" class="input-group">
          <input type="text" id="linkNameInput" placeholder="Link name" required />
          <input type="url" id="linkUrlInput" placeholder="URL (https://...)" required />
          <button type="submit" class="btn btn-primary">Add Link</button>
        </form>
        <div id="quickLinksContainer" class="quick-links-container"></div>
      </section>

    </main>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
